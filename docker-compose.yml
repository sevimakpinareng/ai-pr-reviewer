services:
  postgres:
    image: postgres:16
    container_name: prreviewer-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prreviewer}
      POSTGRES_USER: ${POSTGRES_USER:-prreviewer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prreviewer}
    ports:
      # Host port is configurable to avoid clashing with another local Postgres.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prreviewer} -d ${POSTGRES_DB:-prreviewer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: prreviewer-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-prreviewer}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-prreviewer}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"    # AMQP
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"  # management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  rabbitmqdata:
