services:
  postgres:
    image: postgres:16
    container_name: prreviewer-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prreviewer}
      POSTGRES_USER: ${POSTGRES_USER:-prreviewer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prreviewer}
    ports:
      # Host port is configurable to avoid clashing with another local Postgres.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prreviewer} -d ${POSTGRES_DB:-prreviewer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: prreviewer-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-prreviewer}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-prreviewer}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"    # AMQP
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"  # management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prreviewer-redis
    # Ephemeral: no persistence needed for dedupe/superseding/rate-limit keys.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- Optional observability stack (opt-in): docker compose --profile observability up ---
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prreviewer-prometheus
    profiles: ["observability"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: prreviewer-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  rabbitmqdata:
