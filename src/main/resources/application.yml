spring:
  application:
    name: pr-reviewer

  # AI review. Default provider is local Ollama (free during development);
  # activate the "mistral" profile (SPRING_PROFILES_ACTIVE=mistral) to use the
  # hosted Mistral AI API instead. `model.chat` selects exactly one provider so
  # there is a single ChatModel/ChatClient on the classpath.
  ai:
    model:
      chat: ollama
      # We only use chat. Disable the other Mistral/Ollama model autoconfigs
      # (embedding, moderation) so they don't eagerly demand an API key.
      embedding: none
      moderation: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5-coder:7b}
          temperature: ${REVIEW_TEMPERATURE:0.1}
    mistralai:
      api-key: ${MISTRAL_API_KEY:}
      chat:
        options:
          model: ${MISTRAL_MODEL:mistral-small-latest}
          temperature: ${REVIEW_TEMPERATURE:0.1}

  # DB connection is read entirely from the environment so that no secrets
  # ever live in the repo. Defaults point at the local docker-compose Postgres.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prreviewer}
    username: ${DB_USER:prreviewer}
    password: ${DB_PASSWORD:prreviewer}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema, so Hibernate must never auto-create/alter it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Expose Actuator health (and info) over HTTP. Show full health details so the
# DB connection status is visible during local development.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Swagger UI served at /swagger-ui.html, OpenAPI JSON at /v3/api-docs
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# GitHub integration. All credentials come from the environment; nothing
# sensitive is committed.
github:
  app:
    # Numeric GitHub App ID and the path to its private key (.pem, PKCS#1 or
    # PKCS#8). The key file itself must never be committed.
    id: ${GITHUB_APP_ID:0}
    private-key-path: ${GITHUB_PRIVATE_KEY_PATH:}
  api:
    # Overridable so tests can point at a mock server.
    base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
  webhook:
    # Used to verify the HMAC-SHA256 signature of every incoming delivery.
    secret: ${GITHUB_WEBHOOK_SECRET:}

# Review tuning (noise control).
app:
  review:
    # Cap on diff size sent to the model (crude; real chunking comes later).
    max-diff-chars: ${REVIEW_MAX_DIFF_CHARS:12000}
    # Drop findings below this severity (INFO, WARNING, ERROR).
    severity-threshold: ${REVIEW_SEVERITY_THRESHOLD:WARNING}
    # Hard cap on number of findings returned, highest severity first.
    max-findings: ${REVIEW_MAX_FINDINGS:10}
    # Max number of files from one diff to analyze (one model call per file).
    max-files: ${REVIEW_MAX_FILES:20}
    # When there are no findings, still post a short "no issues" review.
    post-empty-review: ${REVIEW_POST_EMPTY:true}
