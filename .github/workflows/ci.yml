name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    name: Compile (fast feedback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Quick fail: does everything (main + tests) still compile? No tests run.
      - name: Compile main and tests
        run: ./mvnw -B -DskipTests test-compile

  build:
    name: Build & Test
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # ubuntu-latest ships a working Docker daemon, so Testcontainers
      # (PostgreSQL + RabbitMQ + Redis) starts directly — do NOT use -Pcolima,
      # that profile only works around local colima/macOS quirks. The tests mock
      # the external edges (GitHub API, LLM), so no secrets are required.
      - name: Build, test and coverage (mvn verify)
        run: ./mvnw -B verify

      - name: Coverage summary
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ ! -f "$csv" ]; then
            echo "No JaCoCo report (build failed before coverage)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Coverage (line, trivial code excluded)"
            echo ""
            echo "| Package | Coverage | Lines |"
            echo "|---|---:|---:|"
            awk -F, 'NR>1 { split($2,a,"."); p=a[length(a)];
                            miss[p]+=$8; cov[p]+=$9; tm+=$8; tc+=$9 }
                     END {
                       for (k in cov) { t=miss[k]+cov[k];
                         printf "| %s | %.1f%% | %d/%d |\n", k, 100*cov[k]/t, cov[k], t }
                       t=tm+tc; printf "| **Total** | **%.1f%%** | **%d/%d** |\n", 100*tc/t, tc, t
                     }' "$csv"
          } >> "$GITHUB_STEP_SUMMARY"

      # Upload even on failure so surefire reports show which test broke.
      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            target/surefire-reports/**
            target/site/jacoco/**
          if-no-files-found: warn
          retention-days: 14
